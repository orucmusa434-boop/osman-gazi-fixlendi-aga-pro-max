name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q ./*.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: OsmanGaziForge
      - uses: actions/upload-artifact@v4
        with:
          name: OsmanGazi-forge-26.3
          path: OsmanGaziForge/build/libs/*.jar
